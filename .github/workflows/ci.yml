name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pickleshell-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            gateway/package-lock.json
            mcp-server/package-lock.json
            terminal/package-lock.json
      - name: Install dependencies
        run: |
          npm --prefix gateway ci
          npm --prefix mcp-server ci
          npm --prefix terminal ci
      - name: Rebuild node-pty from source
        run: npm_config_build_from_source=true npm --prefix terminal rebuild node-pty
      - name: Build monorepo and native launcher
        run: npm run build
      - name: Native PTY smoke test
        run: npm --prefix terminal run test:native-smoke
      - name: Full tests
        shell: bash
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          set +e
          npm test 2>&1 | tee "$log_file"
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            tail_text="$(tail -c 12000 "$log_file")"
            escaped="${tail_text//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            printf '::error title=Full tests failed::%s\n' "$escaped"
            if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
              {
                printf '### Full tests failure tail\n\n```text\n'
                tail -c 12000 "$log_file"
                printf '\n```\n'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit "$test_status"
      - name: Dependency audit
        run: npm run audit
      - name: Diff check
        run: git diff --check
      - name: Cgroup integration gate
        run: |
          echo 'SKIP: privileged cgroup integration requires a separately delegated systemd contour; standard GitHub runners do not run it'
