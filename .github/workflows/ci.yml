name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pickleshell-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            gateway/package-lock.json
            mcp-server/package-lock.json
            terminal/package-lock.json
      - name: Install dependencies
        run: |
          npm --prefix gateway ci
          npm --prefix mcp-server ci
          npm --prefix terminal ci
      - name: Rebuild node-pty from source
        run: npm_config_build_from_source=true npm --prefix terminal rebuild node-pty
      - name: Build monorepo and native launcher
        run: npm run build
      - name: Native PTY smoke test
        run: npm --prefix terminal run test:native-smoke
      - name: Stage trusted Node for deployment tests
        shell: bash
        run: |
          set -euo pipefail
          matrix_node=$(command -v node)
          matrix_version=$(node -p 'process.versions.node')
          sudo install -d -o root -g root -m 0755 /opt /opt/pickleshell /opt/pickleshell/runtime /opt/pickleshell/runtime/ci-node /opt/pickleshell/runtime/ci-node/bin
          sudo install -o root -g root -m 0755 "$matrix_node" /opt/pickleshell/runtime/ci-node/bin/node
          if [[ -e /usr/local/bin/tunnel-client ]]; then
            printf 'CI tunnel-client fixture path already exists: /usr/local/bin/tunnel-client\n' >&2
            exit 1
          fi
          sudo install -d -o root -g root -m 0755 /usr/local /usr/local/bin
          tunnel_stub=$(mktemp)
          cat >"$tunnel_stub" <<'STUB'
          #!/usr/bin/env bash
          printf 'CI tunnel-client validation stub must not be executed\n' >&2
          exit 99
          STUB
          sudo install -o root -g root -m 0755 "$tunnel_stub" /usr/local/bin/tunnel-client
          rm -f -- "$tunnel_stub"
          staged_version=$(/opt/pickleshell/runtime/ci-node/bin/node -p 'process.versions.node')
          if [[ $staged_version != "$matrix_version" ]]; then
            printf 'staged Node version mismatch: matrix=%s staged=%s\n' "$matrix_version" "$staged_version" >&2
            exit 1
          fi
          for path in /opt /opt/pickleshell /opt/pickleshell/runtime /opt/pickleshell/runtime/ci-node /opt/pickleshell/runtime/ci-node/bin /opt/pickleshell/runtime/ci-node/bin/node /usr/local /usr/local/bin /usr/local/bin/tunnel-client; do
            [[ $(stat -c '%u' -- "$path") == 0 ]] || { printf 'trusted CI Node path is not root-owned: %s\n' "$path" >&2; exit 1; }
            mode=$(stat -c '%a' -- "$path")
            (( (8#$mode & 022) == 0 )) || { printf 'trusted CI Node path is group/other writable: %s mode=%s\n' "$path" "$mode" >&2; exit 1; }
          done
      - name: Full tests
        shell: bash
        env:
          PICKLESHELL_TEST_NODE_EXECUTABLE: /opt/pickleshell/runtime/ci-node/bin/node
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          set +e
          npm test 2>&1 | tee "$log_file"
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            tail_text="$(tail -c 12000 "$log_file")"
            escaped="${tail_text//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            printf '::error title=Full tests failed::%s\n' "$escaped"
            if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
              {
                printf '### Full tests failure tail\n\n```text\n'
                tail -c 12000 "$log_file"
                printf '\n```\n'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit "$test_status"
      - name: Dependency audit
        run: npm run audit
      - name: Diff check
        run: git diff --check
      - name: Cgroup integration gate
        run: |
          echo 'SKIP: privileged cgroup integration requires a separately delegated systemd contour; standard GitHub runners do not run it'
      - name: Clean trusted CI fixtures
        if: always()
        run: |
          sudo rm -f -- /usr/local/bin/tunnel-client
          sudo rm -rf -- /opt/pickleshell/runtime/ci-node
